name: Build unsigned IPA

# 通用版：自动处理 xcodeproj / xcworkspace / xcodegen(project.yml) / 子目录工程。
# 产物：Actions → 本次运行 → Artifacts → unsigned-ipa

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version

      - name: Prepare project (xcodegen if needed)
        id: prep
        run: |
          set -euo pipefail
          SPEC=$(find . -maxdepth 3 -name project.yml -not -path './.build/*' -not -path '*/Vendor/*' | head -n 1)
          if [ -n "$SPEC" ]; then
            echo "发现 xcodegen spec：$SPEC"
            brew install xcodegen
            DIR=$(dirname "$SPEC")
            (cd "$DIR" && xcodegen generate)
          fi

          PROJ=$(find . -maxdepth 3 -name '*.xcworkspace' \
            -not -path './.build/*' -not -path '*/Vendor/*' -not -path '*.xcodeproj/*' | head -n 1)
          if [ -z "$PROJ" ]; then
            PROJ=$(find . -maxdepth 3 -name '*.xcodeproj' \
              -not -path './.build/*' -not -path '*/Vendor/*' | head -n 1)
          fi
          test -n "$PROJ" || { echo "没找到 Xcode 工程"; exit 1; }
          echo "工程：$PROJ"
          echo "proj=$PROJ" >> "$GITHUB_OUTPUT"

      - name: Build Release (unsigned)
        run: |
          set -euo pipefail
          PROJ="${{ steps.prep.outputs.proj }}"
          case "$PROJ" in
            *.xcworkspace) TARGET=(-workspace "$PROJ") ;;
            *)             TARGET=(-project "$PROJ") ;;
          esac
          SCHEME=$(xcodebuild "${TARGET[@]}" -list -json \
            | python3 -c "import sys,json;d=json.load(sys.stdin);print((d.get('workspace') or d.get('project'))['schemes'][0])")
          echo "Scheme：$SCHEME"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          xcodebuild "${TARGET[@]}" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package into IPA
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -n 1)
          test -n "$APP" || { echo "没有找到 .app"; exit 1; }
          NAME=$(basename "$APP" .app)
          # 老工程常见：Info.plist 里 NSCameraUsageDescription 是空串，运行即闪退，打包时补上
          PLIST="$APP/Info.plist"
          CUR=$(/usr/libexec/PlistBuddy -c "Print :NSCameraUsageDescription" "$PLIST" 2>/dev/null || true)
          if [ -z "$CUR" ]; then
            echo "补写相机权限说明"
            /usr/libexec/PlistBuddy -c "Set :NSCameraUsageDescription 'This app uses the camera and LiDAR sensor to scan your surroundings in 3D.'" "$PLIST" 2>/dev/null \
              || /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'This app uses the camera and LiDAR sensor to scan your surroundings in 3D.'" "$PLIST"
          fi
          rm -rf Payload && mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry "${NAME}-unsigned.ipa" Payload
          ls -lh "${NAME}-unsigned.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: '*-unsigned.ipa'
          if-no-files-found: error
